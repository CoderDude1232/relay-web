<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add on Relay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07030F;
      color: #EDE8FA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .icon {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #9D5CF0, #4A1A9A);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .username { color: #A564F5; font-size: 18px; margin-bottom: 16px; font-weight: 600; }
    p { font-size: 15px; color: #9B88C4; line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #9D5CF0, #4A1A9A);
      color: #fff;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-outline {
      display: block;
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(123,47,224,0.4);
      color: #EDE8FA;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💬</div>
    <h1>Add me on Relay</h1>
    <p class="username" id="username-display"></p>
    <p>Relay is a private, end-to-end encrypted messenger. Download the app to connect.</p>
    <a class="btn" href="#" id="app-store-link">Download Relay</a>
    <a class="btn-outline" href="#" id="open-app-link">Open in Relay</a>
  </div>
  <script>
    const parts = window.location.pathname.split('/');
    const username = parts[parts.length - 1] || parts[parts.length - 2] || '';
    if (username) {
      document.getElementById('username-display').textContent = '@' + username;
      document.getElementById('open-app-link').href = 'relay://add/' + username;
    }
    // App Store link — update when published
    document.getElementById('app-store-link').href = 'https://apps.apple.com/app/relay';
  </script>
</body>
</html>
