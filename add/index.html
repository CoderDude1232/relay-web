<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay</title>
  <meta name="description" content="You've been invited to connect on Relay." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #fff;
      color: #0a0a0a;
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 32px;
      max-width: 480px;
    }

    .wordmark {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6820d4;
      margin-bottom: 48px;
    }

    .invite-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    h1 .handle {
      color: #6820d4;
    }

    .description {
      font-size: 16px;
      color: #555;
      line-height: 1.6;
      max-width: 360px;
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 280px;
    }

    .btn-get {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      background: #6820d4;
      color: #fff;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .btn-open {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 13px 20px;
      background: transparent;
      color: #6820d4;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    footer {
      padding: 24px 32px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      gap: 20px;
    }

    footer a {
      font-size: 12px;
      color: #aaa;
      text-decoration: none;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #f5f5f5; }
      .description { color: #888; }
      footer { border-color: #1e1e1e; }
      footer a { color: #555; }
      .btn-open { color: #a87ff0; }
      h1 .handle { color: #a87ff0; }
      .wordmark { color: #a87ff0; }
    }
  </style>
</head>
<body>
  <main>
    <p class="wordmark">Relay</p>
    <p class="invite-label">You were invited by</p>
    <h1><span class="handle" id="handle">@someone</span><br/>wants to chat.</h1>
    <p class="description">Relay is an end-to-end encrypted messenger. Get the app to connect.</p>
    <div class="actions">
      <a class="btn-get" href="https://apps.apple.com/app/relay" id="app-store-link">
        Get Relay for iPhone
      </a>
      <a class="btn-open" href="#" id="open-link">Already have it? Open →</a>
    </div>
  </main>
  <footer>
    <a href="/privacy.html">Privacy</a>
    <a href="/terms.html">Terms</a>
    <a href="mailto:support@relaymsg.app">Support</a>
  </footer>
  <script>
    const parts = location.pathname.replace(/\/$/, '').split('/');
    const username = parts[parts.length - 1];
    if (username && username !== 'add') {
      document.getElementById('handle').textContent = '@' + username;
      document.getElementById('open-link').href = 'relay://add/' + username;
    }
  </script>
</body>
</html>
